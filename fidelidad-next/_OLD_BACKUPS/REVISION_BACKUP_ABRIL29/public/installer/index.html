<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMPET - Entorno Visual de Instalación</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --bg: #0b0f19;
            --card-bg: rgba(23, 23, 37, 0.6);
            --border: rgba(255, 255, 255, 0.05);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 300;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px;
            border-radius: 14px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Form Controls */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .full-width {
            grid-column: span 2;
        }

        @media (max-width: 768px) {
            .full-width { grid-column: span 1; }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label span {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 12px;
        }

        input, textarea, select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            color: var(--text-main);
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Checkbox Switch */
        .switch-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary), #4f46e5);
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            margin-top: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-git {
            background: linear-gradient(135deg, #1f2937, #111827);
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-git:hover {
            background: linear-gradient(135deg, #374151, #1f2937);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        /* Terminal Console */
        .console-container {
            margin-top: 30px;
            background: #05070f;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            display: none;
        }

        .console-header {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
        }
        .dot:nth-child(2) { background: #f59e0b; }
        .dot:nth-child(3) { background: #10b981; }

        .console-output {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #34d399;
            white-space: pre-wrap;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">RAMPET</div>
        <div class="subtitle">Entorno Visual de Instalación y Despliegues</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('install-tab')">🛠️ Instalador de Clientes</button>
        <button class="tab-btn" onclick="switchTab('git-tab')">🔄 Actualizador Git (Prod)</button>
    </div>

    <!-- TAB 1: INSTALADOR -->
    <div id="install-tab" class="tab-content active">
        <form id="installForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>Nombre del Comercio <span>(Ej: Rampet Mascotas)</span></label>
                    <input type="text" id="appName" placeholder="Ingresa el nombre" required>
                </div>
                
                <div class="input-group">
                    <label>Nombre Corto <span>(Ej: RAMPET)</span></label>
                    <input type="text" id="appShortName" placeholder="Nombre para el menú" required>
                </div>

                <div class="input-group">
                    <label>API Key Interna <span>(Usa palabras largas)</span></label>
                    <input type="password" id="apiKey" placeholder="rampet_secure_..." required>
                </div>

                <div class="input-group">
                    <label>Master Login Key <span>(Universal de Soporte)</span></label>
                    <input type="text" id="masterKey" value="Felipe01" placeholder="Felipe01">
                </div>

                <div class="input-group full-width">
                    <div class="switch-group">
                        <label>Activar Módulo de Mascotas <span>(Vacunas, Alertas de Alimento)</span></label>
                        <label class="switch">
                            <input type="checkbox" id="enablePetModule">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label>Gmail Usuario <span>(SMTP)</span></label>
                    <input type="email" id="smtpUser" placeholder="usuario@gmail.com" required>
                </div>

                <div class="input-group">
                    <label>Contraseña de Aplicación Gmail <span>(16 letras)</span></label>
                    <input type="password" id="smtpPass" placeholder="xxxx xxxx xxxx xxxx" required>
                </div>

                <div class="input-group full-width">
                    <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 10px 0;">
                </div>

                <div class="input-group">
                    <label>Firebase Project ID</label>
                    <input type="text" id="fbProjectId" placeholder="tu-proyecto-firebase-id" required>
                </div>

                <div class="input-group">
                    <label>Firebase API Key</label>
                    <input type="text" id="fbApiKey" placeholder="AIzaSy..." required>
                </div>

                <div class="input-group">
                    <label>VAPID Public Key <span>(Web Push)</span></label>
                    <input type="text" id="vapidKey" placeholder="Tu llave de notificaciones push" required>
                </div>

                <div class="input-group">
                    <label>URL Vercel <span>(PWA Completa)</span></label>
                    <input type="url" id="pwaUrl" placeholder="https://tu-cliente.vercel.app" required>
                </div>

                <div class="input-group full-width">
                    <label>Firebase Service Account JSON <span>(Grupo Admin SDK)</span></label>
                    <textarea id="fbCredentialsJson" rows="6" placeholder='{ "type": "service_account", ... }' required></textarea>
                </div>
            </div>

            <button type="submit" class="btn-primary">🚀 Crear y Desplegar Instancia</button>
        </form>
    </div>

    <!-- TAB 2: ACTUALIZADOR GIT -->
    <div id="git-tab" class="tab-content">
        <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 20px; line-height: 1.6;">
            Esta acción tomará todo el progreso verificado en la rama <strong style="color: var(--accent);">desarrollo</strong> y lo unificará automáticamente con la rama <strong style="color: var(--primary);">main</strong> (Producción) para impactar los cambios en todos los clientes.
        </p>
        <button id="btnGitSync" class="btn-primary btn-git" onclick="runGitSync()">🚀 Sincronizar Desarrollo -> Producción (Main)</button>
    </div>

    <!-- CONSOLA DE LOGS -->
    <div id="consoleContainer" class="console-container">
        <div class="console-header">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <span style="margin-left: 6px;">Consola de Ejecución en Vivo</span>
        </div>
        <div id="consoleOutput" class="console-output">Esperando acciones...</div>
    </div>
</div>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // Instalador POST
    document.getElementById('installForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const consoleContainer = document.getElementById('consoleContainer');
        const consoleOutput = document.getElementById('consoleOutput');
        
        consoleContainer.style.display = 'block';
        consoleOutput.textContent = 'Enviando configuración...\n';

        const payload = {
            appName: document.getElementById('appName').value,
            appShortName: document.getElementById('appShortName').value,
            apiKey: document.getElementById('apiKey').value,
            masterKey: document.getElementById('masterKey').value,
            enablePetModule: document.getElementById('enablePetModule').checked,
            smtpUser: document.getElementById('smtpUser').value,
            smtpPass: document.getElementById('smtpPass').value,
            fbProjectId: document.getElementById('fbProjectId').value,
            fbApiKey: document.getElementById('fbApiKey').value,
            vapidKey: document.getElementById('vapidKey').value,
            pwaUrl: document.getElementById('pwaUrl').value,
            fbCredentialsJson: document.getElementById('fbCredentialsJson').value
        };

        try {
            const response = await fetch('/api/install', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                consoleOutput.textContent += decoder.decode(value);
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }
        } catch (error) {
            consoleOutput.textContent += `\n❌ Error de red: ${error.message}`;
        }
    });

    // Git Sync POST
    async function runGitSync() {
        const consoleContainer = document.getElementById('consoleContainer');
        const consoleOutput = document.getElementById('consoleOutput');
        
        consoleContainer.style.display = 'block';
        consoleOutput.textContent = 'Iniciando flujo de Git...\n';

        try {
            const response = await fetch('/api/git-sync', {
                method: 'POST'
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                consoleOutput.textContent += decoder.decode(value);
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }
        } catch (error) {
            consoleOutput.textContent += `\n❌ Error de red: ${error.message}`;
        }
    }
</script>

</body>
</html>
